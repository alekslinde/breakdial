name: Bug report
description: Something breaks that BreakDial didn't intend
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro (package, version, dial level, minimal snippet)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Node / npm versions
