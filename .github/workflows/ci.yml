name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor must be what engines.node claims, plus the current LTS.
        # Widen the matrix before widening the range, never after.
        node: [22, 24, 26]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `node: 22` resolves to the latest 22.x, so assert the runner really
      # satisfies the declared floor rather than trusting the major.
      - name: Check runner satisfies engines.node
        run: node ./scripts/check-node-floor.mjs

      # Each Node major bundles a different npm, and npm's `--json` output
      # shapes have changed across majors. Record which one ran, so a future
      # difference is diagnosable from the log rather than by guesswork.
      - name: Record toolchain
        run: |
          echo "node $(node -v), npm $(npm -v)"
          echo "node $(node -v), npm $(npm -v)" >> "$GITHUB_STEP_SUMMARY"

      - run: npm ci

      # Typecheck first: it is non-emitting and resolves siblings to their
      # sources, so it needs no build and reports type errors before a slower
      # build obscures them. Build then precedes the smoke suite, which imports
      # dist/ through the real resolver and would otherwise test nothing.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test the built output
        run: npm run smoke

      # Also gates NOTICE drift between the root and the per-package copies.
      # Without this here, drift passes CI and only fails in release.yml —
      # after the tag is already pushed.
      - name: Licence headers, manifests and NOTICE copies
        run: npm run license:check

      # A manifest can claim a file that is absent from the tarball with no
      # warning. Pack and assert, rather than trusting `files`.
      - name: Pack and verify tarball contents
        run: npm run check:tarballs
